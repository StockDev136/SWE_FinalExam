services:
  postgres:
    image: postgres:18
    container_name: finalexam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: TESTDB
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Password1
    ports:
      - "5433:5432"
    volumes:
      - finalexam_pg_data:/var/lib/postgresql

volumes:
  finalexam_pg_data: